name: Deploy IPC AMR dashboard to Cloudflare Workers

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # OAuth client IDs are public browser configuration, not secrets.
  VITE_GOOGLE_CLIENT_ID: "923298315983-8cf3md0efidr5l5f1dlllig5i2814ocm.apps.googleusercontent.com"

concurrency:
  # Keep production deploys isolated from feature-branch and pull-request CI runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate OAuth configuration for production deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [[ -z "$VITE_GOOGLE_CLIENT_ID" ]]; then
            echo "::error title=Missing GitHub Actions variable::GOOGLE_OAUTH_CLIENT_ID is required for private Google Sheets OAuth."
            exit 1
          fi
      - name: Build frontend and type-check
        run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Deploy static app to Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 827df3dff7217c483bae6b6fc62083d8
