name: Build dashboard
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Google Apps Script syntax
        run: node --check < integrations/google-apps-script/Code.gs
      - run: npm install
      - run: npm run build
